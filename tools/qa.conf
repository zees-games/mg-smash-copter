# What the shared QA scripts in dot-game/tools need to know about this game (sourced by perf_budget.sh, visual_check.sh).
# One perf case: the real client against the real server scene and module (the bench has no map switch).
PERF_CASES=field
PERF_SECONDS=20

perf_run_case() {
    GPU_TIMEOUT=300 timeout -k 10 360 ../gpu.sh run "$GAME" res://tools/client_bench.tscn -- \
        --delay 20 --play --seconds "$2" --json
}

# A case is a tools/shot.sh view; each leaves screenshots/<view>_view.png.
VISUAL_CASES="field eyes"
VISUAL_SHOTS="view"

visual_render() { heavy -- timeout 300 tools/shot.sh --view="$1" --out="res://screenshots/${1}_view.png"; }
